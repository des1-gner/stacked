function drawStrTo(c,s,x,y,col,sc){c.fillStyle=col;for(let i=0;i<s.length;i++){const g=FONT[s[i]];if(!g)continue;for(let r=0;r<5;r++){const b=g.charCodeAt(r)-48;if(!b)continue;for(let q=0;q<3;q++)if(b&(4>>q))c.fillRect(x+(i*4+q)*sc,y+r*sc,sc,sc);}}}
const txtW=(s,sc=1)=>String(s).length*4*sc-sc;
function txt(s,x,y,col='#f4f4f4',sc=1,align='l',sh='#1a1c2c'){s=String(s).toUpperCase();const w=txtW(s,sc);if(align==='c')x-=w/2;else if(align==='r')x-=w;x=Math.round(x);y=Math.round(y);if(sh){const o=Math.max(1,sc>>1);drawStrTo(ctx,s,x+o,y+o,sh,sc);}drawStrTo(ctx,s,x,y,col,sc);return w;}

const PAL={k:'#1a1c2c',d:'#333c57',G:'#566c86',g:'#94b0c2',w:'#f4f4f4',r:'#b13e53',o:'#ef7d57',y:'#ffcd75',l:'#a7f070',L:'#38b764',t:'#257179',s:'#29366f',b:'#3b5dc9',B:'#41a6f6',c:'#73eff7',p:'#5d275d',P:'#ff77a8',m:'#f6a6d0'};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
function fromRows(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const [c,x]=mkCanvas(w,h);for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch!=='.'&&PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}return c;}
function ell(c,cx,cy,rx,ry,col){c.fillStyle=col;for(let y=-ry;y<=ry;y++){const dx=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/((ry+0.5)*(ry+0.5)))));c.fillRect(Math.round(cx-dx),Math.round(cy+y),dx*2+1,1);}}
function disc(x,y,r,col){ctx.fillStyle=col;x=Math.round(x);y=Math.round(y);r=Math.round(r);if(r<=0){ctx.fillRect(x,y,1,1);return;}for(let dy=-r;dy<=r;dy++){const dx=Math.round(Math.sqrt(r*r-dy*dy));ctx.fillRect(x-dx,y+dy,dx*2+1,1);}}
function ring(x,y,r,col,th=1){ctx.fillStyle=col;const n=Math.max(12,Math.floor(r*6.3));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),th,th);}}
function line(x0,y0,x1,y1,col,th=1){ctx.fillStyle=col;const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));const o=th>>1;for(let i=0;i<=n;i++)ctx.fillRect(Math.round(lerp(x0,x1,i/n))-o,Math.round(lerp(y0,y1,i/n))-o,th,th);}

function audioInit(){if(ac){if(ac.state==='suspended')ac.resume();return;}const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);master=ac.createGain();master.gain.value=muted?0:0.5;master.connect(comp);sfxG=ac.createGain();sfxG.connect(master);musG=ac.createGain();musG.gain.value=0.3;musG.connect(master);nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;Music.next=ac.currentTime+0.1;}

function noise(o){if(!ac)return;const n=o.at!==undefined?o.at:ac.currentTime+(o.d||0);const t=o.t||0.2;const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const f=ac.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||1000,n);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,n+t);f.Q.value=o.q||1;const g=ac.createGain();g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(o.v||0.2,n+(o.a||0.005));g.gain.exponentialRampToValueAtTime(0.0001,n+t);s.connect(f);f.connect(g);g.connect(o.dest||sfxG);s.start(n,Math.random()*0.5);s.stop(n+t+0.05);}

const mf=n=>440*Math.pow(2,(n-69)/12);
function mkFight(){const roots=[50,46,48,45],bass=[],drum=[];
 const lead=[74,0,77,0,79,0,77,0,74,0,0,0,72,0,74,0, 77,0,79,0,81,0,79,0,77,0,0,0,74,0,0,0, 79,0,81,0,84,0,81,0,79,0,77,0,79,0,0,0, 81,0,0,79,0,0,77,0,76,0,74,0,0,0,0,0];
 for(let b=0;b<4;b++)for(let i=0;i<16;i++){bass.push(i%2===0?roots[b]+((i/2)%2?12:0):0);drum.push(i%8===4?'s':i%8===0?'k':i%2?'h':'');}
 return {bpm:132,bass,lead,drum,len:64,lv:0.04,ld:2};}
function mkMenu(){const m=mkFight();m.bpm=100;m.drum=m.drum.map(d=>d==='s'?'h':d==='h'?'':d);m.lv=0.03;return m;}
const TRACKS={fight:mkFight(),menu:mkMenu()};
function playStep(tr,i,at){const sp=60/tr.bpm/4;const b=tr.bass[i];if(b)tone({type:'triangle',f:mf(b),t:sp*1.8,v:0.26,at,dest:musG});const l=tr.lead[i];if(l){tone({type:'square',f:mf(l),t:sp*tr.ld*1.6,v:tr.lv,at,dest:musG});tone({type:'square',f:mf(l),t:sp*tr.ld*1.6,v:tr.lv*0.5,at,dest:musG,det:12});}
 const d=tr.drum[i];if(d==='k')tone({type:'sine',f:150,f2:40,t:0.16,v:0.5,at,dest:musG});else if(d==='s')noise({ft:'bandpass',f:1800,q:0.7,t:0.13,v:0.2,at,dest:musG});else if(d==='h')noise({ft:'highpass',f:7000,t:0.035,v:0.06,at,dest:musG});}

function rollCard(exclude){let tot=0;const pool=CARDS.filter(c=>!exclude.has(c.id));for(const c of pool)tot+=RAR[c.r].w;let r=Math.random()*tot;for(const c of pool){r-=RAR[c.r].w;if(r<=0)return c;}return pool[0];}
function dealOffer(n=3){const ex=new Set(),out=[];for(let i=0;i<n;i++){const c=rollCard(ex);ex.add(c.id);out.push(c);}return out;}

 for(let i=0;i<n-1;i++){const b=Math.round(y0+(i+1)*h);x.fillStyle=cols[i+1];for(let xx=0;xx<W;xx+=4)x.fillRect(xx,b-2,1,1);for(let xx=0;xx<W;xx+=2)x.fillRect(xx+1,b-1,1,1);x.fillStyle=cols[i];for(let xx=0;xx<W;xx+=2)x.fillRect(xx,b,1,1);for(let xx=0;xx<W;xx+=4)x.fillRect(xx+2,b+1,1,1);}}

let parts=[];
function P(x,y,vx,vy,life,col,sz=1,g=0.08){if(parts.length>2000)return;parts.push({x,y,vx,vy,life,max:life,col,sz,g});}
function burst(x,y,n,col,sp=2,life=30,sz=1){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(0.3,1)*sp;P(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(life*0.6,life),col,sz);}}
function updParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life--;p.vy+=p.g;p.vx*=0.97;p.x+=p.vx;p.y+=p.vy;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();}}}
function drawParts(){for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/p.max*1.6);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);}ctx.globalAlpha=1;}
function splat(x,y,col,n){if(!G||!G.dctx)return;const d=G.dctx;d.fillStyle=col;for(let i=0;i<n*3;i++){const a=rand(0,6.28),r=Math.pow(Math.random(),1.5)*n*1.6;d.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),Math.random()<0.3?2:1,1);}}

function boxSolid(x,y,hw,hh){if(x-hw<0||x+hw>W||y-hh<0)return true;for(const r of G.arena.rects)if(!r.o&&x+hw>r.x&&x-hw<r.x+r.w&&y+hh>r.y&&y-hh<r.y+r.h)return true;return false;}
function groundBelow(x,y,depth){for(const r of G.arena.rects)if(x>=r.x&&x<=r.x+r.w&&r.y>=y-2&&r.y<=y+depth)return true;return false;}
function groundY(x,y){let best=H+20;for(const r of G.arena.rects)if(x>=r.x&&x<=r.x+r.w&&r.y>=y&&r.y<best)best=r.y;return best;}
function los(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/3);for(let i=1;i<n;i++)if(solidAt(lerp(x0,x1,i/n),lerp(y0,y1,i/n)))return false;return true;}

 for(const x of xs){let best=null;for(const r of G.arena.rects){if(x>=r.x+4&&x<=r.x+r.w-4&&r.y>24&&!boxSolid(x,r.y-10,5,8)){if(!best||r.y<best.y)best=r;}}if(best)return{x,y:best.y};}
 return{x:side?W-80:80,y:120};}

 MENU.forEach((m,i)=>{const y=138+i*16,sel=i===menuSel;if(sel){ctx.globalAlpha=0.5;ctx.fillStyle='#29366f';ctx.fillRect(W/2-90,y-4,180,13);ctx.globalAlpha=1;}
  if(i===3)txt(sel&&(frame>>4)%2?'> START <':'START',W/2,y,sel?'#ffcd75':'#f4f4f4',1,'c');else{txt(m.n,W/2-80,y,sel?'#ffcd75':'#94b0c2');txt((sel?'< ':'')+m.v()+(sel?' >':''),W/2+80,y,'#f4f4f4',1,'r');}});
 if(OPTS.mode===1&&menuSel===0)txt('P1: WASD + MOUSE   P2: ARROWS, / SHOOT, . BLOCK (AUTO AIM) OR GAMEPAD',W/2,206,'#ff77a8',1,'c');
 txt('MOVE A D   JUMP W/SPACE   DROP S   SHOOT LMB   BLOCK RMB/SHIFT/E',W/2,224,'#94b0c2',1,'c');
 txt('TAB VIEW BUILDS   P/ESC PAUSE   M MUTE   GAMEPAD SUPPORTED',W/2,234,'#566c86',1,'c');}
function drawCursor(){const x=Math.round(mouse.x),y=Math.round(mouse.y);ctx.fillStyle='#1a1c2c';ctx.fillRect(x-4,y-1,9,3);ctx.fillRect(x-1,y-4,3,9);ctx.fillStyle='#f4f4f4';ctx.fillRect(x-3,y,7,1);ctx.fillRect(x,y-3,1,7);ctx.fillStyle='#ff3040';ctx.fillRect(x,y,1,1);}

// ---------------- loop ----------------
let frame=0;
function update(){frame++;pollPads();if(pressed.KeyM)setMute(!muted);
 if(screen==='title')updTitle();
 else if(screen==='game'){if(hitk(['KeyP','Escape'])&&G.phase!=='matchEnd'){screen='pause';}else if(hitstop>0)hitstop--;else updMatch();}
 else if(screen==='pause'){if(hitk(['KeyP','Escape','Enter']))screen='game';else if(pressed.KeyQ){screen='title';newMatch(true);setMusic('menu');}}
 if(shake>0){shake*=0.85;if(shake<0.3)shake=0;}if(flashA>0)flashA=Math.max(0,flashA-0.05);
 for(const k in pressed)delete pressed[k];mouse.lp=mouse.rp=false;}
function render(){ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);ctx.save();if(shake>0&&screen!=='title')ctx.translate(Math.round(rand(-shake,shake)),Math.round(rand(-shake,shake)));
 if(screen==='title')renderTitle();else renderMatch();ctx.restore();
 if(screen==='pause'){ctx.globalAlpha=0.6;ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;txt('PAUSED',W/2,90,'#ffcd75',4,'c');txt('P / ESC  RESUME      Q  QUIT TO MENU      M  MUTE',W/2,124,'#94b0c2',1,'c');drawBuild(G.players[0],12,150,'l',10);drawBuild(G.players[1],W-12,150,'r',10);}
 if(flashA>0){ctx.globalAlpha=Math.min(1,flashA);ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
 if(muted)txt('MUTED',W-4,H-10,'#566c86',1,'r');drawCursor();}
newMatch(true);
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){acc-=STEP;update();}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__st={get G(){return G;},get screen(){return screen;},set screen(v){screen=v;},newMatch,startRound,update,render,OPTS,CARDS};
</script></body></html>
